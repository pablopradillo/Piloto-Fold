<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="#0c1017"/>
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#glow)">
    <polygon points="60,25 90,38 60,50 30,38" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M42,43.5 v14 c0,6 8,11 18,11 c10,0 18,-5 18,-11 v-14" fill="none" stroke="url(#neonGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tassel -->
    <path d="M34,40 v14 c0,2 -2,4 -3,6" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="31" cy="62" r="2.5" fill="url(#neonGrad)"/>

    <!-- Spade Body -->
    <path d="M60,48 C60,48 40,66 40,80 C40,90 49,94 55,91 C57,90 58.5,88 60,86 C61.5,88 63,90 65,91 C71,94 80,90 80,80 C80,66 60,48 60,48 Z" 
          fill="none" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Spade Stem -->
    <path d="M57,90 L53,101 L67,101 L63,90" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
